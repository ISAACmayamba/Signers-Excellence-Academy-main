<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <!-- Background (Transparent/Light context) -->
  <rect width="600" height="160" fill="none" />

  <!-- Logo Mark / Icon Group -->
  <g transform="translate(20, 10)">
    <!-- Outer Shield / Badge Outline -->
    <path d="M 70,10 L 120,30 V 85 C 120,115 70,135 70,135 C 70,135 20,115 20,85 V 30 Z" 
          fill="#0284c7" />
    <path d="M 70,18 L 112,35 V 82 C 112,107 70,124 70,124 C 70,124 28,107 28,82 V 35 Z" 
          fill="#0f172a" />
    
    <!-- Stylized Hands / Book Icon -->
    <path d="M 50,85 C 50,85 60,60 70,60 C 80,60 90,85 90,85" 
          stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="70" cy="48" r="8" fill="#38bdf8" />
    <path d="M 45,95 Q 70,105 95,95" 
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Name: SL-CLASSES -->
  <text x="160" y="82" 
        font-family="'Poppins', 'Segoe UI', sans-serif" 
        font-weight="700" 
        font-size="46" 
        fill="#0f172a" 
        letter-spacing="1">SL-CLASSES</text>

  <!-- Divider Line -->
  <line x1="160" y1="98" x2="560" y2="98" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline -->
  <text x="162" y="122" 
        font-family="'Poppins', 'Segoe UI', sans-serif" 
        font-weight="600" 
        font-size="13" 
        fill="#64748b" 
        letter-spacing="2.5">LANGUAGE • INTERPRETER • SKILLS</text>
</svg>
